<!DOCTYPE html>
<html lang="en">
<head>

<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">

<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">

<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon/android-chrome-512x512.png">

    <meta
    name="robots"
    content="noindex, nofollow"
>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Wingz It Iz digital restaurant menu board."
    >

    <title>Digital Menu | Wingz It Iz</title>

    <link rel="icon" href="assets/logo.jpg">
    <link rel="stylesheet" href="tv-menu.css">
</head>

<body>

    <div class="tv-screen">
        <main class="tv-board">

        <header class="tv-header">

            <div class="tv-brand">
                <img
                    src="assets/logo.jpg"
                    alt="Wingz It Iz"
                >

                <div class="tv-brand-copy">
                    <strong class="tv-brand-name">
                        <span class="brand-red">Wingz</span>
                        <span class="brand-blue">It</span>
                        <span class="brand-red">Iz</span>
                    </strong>

                    <span class="tv-tagline">
                        Home of the Famous Garlic Wingz
                    </span>
                </div>
            </div>

            <div class="tv-location">
                <span class="tv-location-label">
                    Digital Menu
                </span>

                <h1 id="tv-location-title">
                    Chicago Menu
                </h1>
            </div>

            <div class="tv-page-status">
                <span id="tv-mode-label">
                    Automatic
                </span>

                <strong id="tv-page-number">
                    Page 1 of 3
                </strong>
            </div>

        </header>

        <section
            id="tv-page"
            class="tv-page"
            aria-live="polite"
        ></section>

        <footer class="tv-footer">

            <span class="tv-footer-domain">
                WingzItIzOfficial.com
            </span>

            <span class="tv-footer-note">
                Menu items, pricing, availability, and specials
                are subject to change without notice.
            </span>

            <span
                id="tv-progress"
                class="tv-progress"
                aria-hidden="true"
            ></span>

        </footer>

        </main>
    </div>

    <div
        id="tv-error"
        class="tv-error"
        hidden
    >
        <h2>Menu unavailable</h2>

        <p>
            Check the location in the TV menu URL.
        </p>
    </div>

    <!-- Shared website and TV menu information -->
    <script src="menu-data.js"></script>

    <!-- TV menu renderer -->
    <script src="tv-menu.js"></script>

</body>
</html>
